<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamverse Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen">

    <header class="flex justify-between items-center p-4 border-b border-gray-800 sticky top-0 bg-black/90 backdrop-blur z-50">
        <div class="flex items-center space-x-2 text-red-500 font-bold text-lg">
            <i class="fas fa-play-circle text-2xl"></i>
            <span>Streamverse Premium</span>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">
        <section class="space-y-3">
            <div class="flex items-center space-x-2 text-red-500 font-bold text-sm">
                <i class="fas fa-fire"></i>
                <span>LATEST POSTS</span>
            </div>

            <div id="posts-grid" class="grid grid-cols-2 gap-3">
                <p class="text-xs text-gray-500 col-span-2">Loading movies...</p>
            </div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1pHDwBRCuLnYPqp-516QRPGk73fQ6kMM",
            authDomain: "streamverse-db.firebaseapp.com",
            projectId: "streamverse-db",
            storageBucket: "streamverse-db.firebasestorage.app",
            messagingSenderId: "131136704676",
            appId: "1:131136704676:web:4206d4d7c673c35ecfd631",
            measurementId: "G-4E1F6SVQ8K"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("movies").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const container = document.getElementById('posts-grid');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<p class="text-xs text-gray-500 col-span-2 text-center py-8">Koi movie nahi mili. Telegram bot se upload karein!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden p-2 flex flex-col justify-between">
                        <img src="${item.poster || 'https://via.placeholder.com/150'}" alt="${item.title}" class="w-full h-40 object-cover rounded-lg mb-2">
                        <h3 class="text-xs font-bold line-clamp-2 mb-2 text-gray-200">${item.title}</h3>
                        <a href="${item.downloadUrl}" target="_blank" class="block text-center text-xs py-2 bg-red-600 hover:bg-red-700 font-semibold rounded-lg text-white">Watch / Download</a>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
