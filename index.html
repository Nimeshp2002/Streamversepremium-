<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamverse Premium - Watch Movies & Anime Online</title>
    <meta name="description" content="Watch latest cartoons, anime, movies and OTT collection in HD quality.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white font-sans min-h-screen">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-gray-800 sticky top-0 bg-black/90 backdrop-blur z-50">
        <div class="flex items-center space-x-2 text-red-500 font-bold text-lg">
            <i class="fas fa-play-circle text-2xl"></i>
            <span>Streamverse Premium</span>
        </div>
        <div class="flex items-center space-x-4">
            <button class="text-gray-300 text-lg"><i class="fas fa-search"></i></button>
            <button class="text-gray-300 text-lg"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- Hero Card -->
        <div class="rounded-2xl bg-gradient-to-br from-indigo-950 via-gray-900 to-black p-6 border border-gray-800 shadow-xl">
            <h1 class="text-xl font-extrabold text-white">Streamverse Premium</h1>
            <p class="text-gray-400 text-xs mt-2">Clean Premium Homepage for Cartoons, Anime, Movies, and OTT Collection</p>
        </div>

        <!-- Categories -->
        <section class="space-y-3">
            <div class="flex items-center space-x-2 text-red-500 font-bold text-sm">
                <i class="fas fa-layer-group"></i>
                <span>CATEGORIES</span>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <button onclick="filterCategory('ALL')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-red-500 text-white">HOME</button>
                <button onclick="filterCategory('CARTOONS')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-900 border border-gray-800 text-gray-300">CARTOONS</button>
                <button onclick="filterCategory('ANIME')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-900 border border-gray-800 text-gray-300">ANIME</button>
                <button onclick="filterCategory('MOVIES')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-900 border border-gray-800 text-gray-300">MOVIES</button>
            </div>
        </section>

        <!-- Latest Posts Grid -->
        <section class="space-y-3">
            <div class="flex items-center space-x-2 text-red-500 font-bold text-sm">
                <i class="fas fa-fire"></i>
                <span>LATEST POSTS</span>
            </div>

            <div id="posts-grid" class="grid grid-cols-2 gap-3">
                <!-- Posts will load dynamically -->
            </div>
        </section>

    </main>

    <script>
        const moviesList = [
            {
                title: "Doraemon Movie 2024",
                category: "CARTOONS",
                poster: "https://via.placeholder.com/300x400?text=Doraemon",
                downloadUrl: "#"
            },
            {
                title: "Naruto Shippuden",
                category: "ANIME",
                poster: "https://via.placeholder.com/300x400?text=Naruto",
                downloadUrl: "#"
            }
        ];

        function loadPosts(items) {
            const container = document.getElementById('posts-grid');
            container.innerHTML = '';
            items.forEach(item => {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden p-2">
                        <img src="${item.poster}" alt="${item.title}" class="w-full h-36 object-cover rounded-lg mb-2">
                        <h3 class="text-xs font-bold line-clamp-2 mb-2">${item.title}</h3>
                        <a href="${item.downloadUrl}" target="_blank" class="block text-center text-xs py-1.5 bg-red-600 hover:bg-red-700 font-semibold rounded text-white">Watch / Download</a>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            if(cat === 'ALL') {
                loadPosts(moviesList);
            } else {
                const filtered = moviesList.filter(m => m.category === cat);
                loadPosts(filtered);
            }
        }

        loadPosts(moviesList);
    </script>
</body>
</html>
